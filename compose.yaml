name: picpeak-usage
services:
  usage:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:3190:3190"
    environment:
      MAINTAINER_TOKEN: ${MAINTAINER_TOKEN:?Set a random maintainer token of at least 32 characters}
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # The container is meant to run behind exactly one TLS-terminating reverse
      # proxy on this host, so one X-Forwarded-For hop is trusted by default.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      - usage-data:/app/storage
volumes:
  usage-data:
