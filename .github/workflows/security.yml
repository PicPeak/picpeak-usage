name: Security regression checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: usage
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: usage_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U usage -d usage_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: picpeak-usage
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: PicPeak/picpeak
          # Includes the English-only catalogs from PicPeak/picpeak#1330.
          ref: 9396d019c6ab7cea81662193410c11ddfd77175c
          path: picpeak
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: picpeak-usage/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: picpeak/backend
      - run: npm ci --no-audit --no-fund
        working-directory: picpeak-usage
      - run: npx playwright install --with-deps chromium
        working-directory: picpeak-usage
      - run: npm run test:required
        working-directory: picpeak-usage
        env:
          PICPEAK_CHECKOUT: ${{ github.workspace }}/picpeak
          TEST_DATABASE_URL: postgres://usage:test-only-password@127.0.0.1:5432/usage_test
      - run: npm audit --audit-level=high
        working-directory: picpeak-usage
      - run: docker build --pull -t picpeak-usage:security-check .
        working-directory: picpeak-usage
      - run: node scripts/runtime-smoke.js picpeak-usage:security-check
        working-directory: picpeak-usage
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: picpeak-usage:security-check
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
